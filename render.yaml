services:
  - type: web
    name: smarttrip-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false          # Set in Render dashboard
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # Paste full JSON as a secret in Render dashboard
      - key: GROQ_API_KEY
        sync: false          # Required: Qwen/Groq text generation
      - key: GROQ_MODEL
        value: qwen/qwen3-27b  # or qwen/qwen3.6-27b — set to your preferred model
      - key: GEOAPIFY_API_KEY
        sync: false          # Fallback: place search, opening hours, geocoding
      - key: GOOGLE_PLACES_API_KEY
        sync: false          # Required: primary place discovery (Google Places API New)
                             # Enable "Places API (New)" in Google Cloud Console first.
      - key: PLACE_PROVIDER
        value: google        # "google" (default) | "geoapify"
      - key: ENABLE_GEOAPIFY_FALLBACK
        value: "true"        # true = use Geoapify when Google returns 0 results
      - key: HF_API_TOKEN
        sync: false          # Required: sentence-transformer embeddings (MemoryEngine)
      - key: GEMINI_API_KEY
        sync: false          # Required: Vision endpoints (AR Explore, landmark recognition)
      # Open-Meteo (weather): no key needed — free public API
      # OSRM (routing): no key needed — uses public instance
